name: Application Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Create the Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk seben-notes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seben-notes-apk
          path: seben-notes.apk
      - name: Publish the APK as a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Seben Notes 1.0.${{ github.run_number }}
          body: "Téléchargez **seben-notes.apk** sur votre téléphone Android, puis ouvrez-le pour installer Seben Notes."
          files: seben-notes.apk
          make_latest: true
